# ==============================================================================
# NGINX SECURITY & ABUSE PREVENTION SNIPPET
# Include inside your `server { ... }` block
# ==============================================================================

# 1. HTTP Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 2. Prevent MIME-Type Sniffing
add_header X-Content-Type-Options "nosniff" always;

# 3. Prevent Clickjacking (framing)
add_header X-Frame-Options "DENY" always;

# 4. Cross-Site Scripting Filter
add_header X-XSS-Protection "1; mode=block" always;

# 5. Referrer Privacy Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Restrict Sensitive Device Hardware & Permissions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;

# 7. Content Security Policy (customize domains as required)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# 8. Web Manifest MIME Type
location ~* \.webmanifest$ {
    types { } default_type "application/manifest+json; charset=utf-8";
}

# 9. Binary Downloads Protection & Rate-Limiting / Noindex
location ^~ /downloads/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=86400" always;
}

# 10. Block Direct Access to Hidden / Sensitive Files (.git, .env)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
